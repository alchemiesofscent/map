<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Periplus Tour MVP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQfZkG8Lk4eCw6tGEaZxEECz7oI4xNQ=" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Periplus Tour MVP</h1>
        <p>Red Sea route from the anonymous <em>Periplus Maris Erythraei</em></p>
      </div>
      <div class="toggles" aria-label="Layer toggles">
        <label><input id="toggle-route" type="checkbox" checked /> Route</label>
        <label><input id="toggle-movements" type="checkbox" checked /> Movements</label>
        <label><input id="toggle-uncertain" type="checkbox" checked /> Uncertain places</label>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel" aria-label="Map">
        <div id="map"></div>
      </section>

      <aside class="card-panel" aria-live="polite">
        <div class="section-kicker" id="section-kicker">Section</div>
        <h2 id="card-title">Loading…</h2>
        <p class="subtitle" id="card-subtitle"></p>
        <p id="card-summary"></p>

        <h3>Translation</h3>
        <p id="translation" class="translation"></p>

        <h3>Places</h3>
        <ul id="places-list" class="metadata-list"></ul>

        <h3>Goods</h3>
        <div id="goods-list" class="pills"></div>

        <h3>Movement notes</h3>
        <ul id="movement-list" class="metadata-list"></ul>

        <h3>Source</h3>
        <p id="source-ref" class="source-ref"></p>

        <div class="nav-buttons">
          <button id="prev-button" type="button">Previous</button>
          <button id="next-button" type="button">Next</button>
        </div>
      </aside>
    </main>

    <nav class="route-strip" aria-label="Main route stops">
      <ol id="route-strip-list"></ol>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
