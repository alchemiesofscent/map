<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Ingredients of the House of Mendes — dossier and interactive map</title>
  <meta name="description" content="A research dossier and ingredient catalogue for Mendesian, Metopion, and Susinum perfumes, with a separate interactive provenance map.">
  <!-- The stylesheet follows the system on its own. This runs before first
       paint so a reader who has overridden that never sees the other palette
       flash first; app-reader.js owns everything else about the theme. -->
  <script>
  (function () {
    try {
      var stored = localStorage.getItem("mendes-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (error) { /* no storage, follow the system */ }
  }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Source+Sans+3:wght@400;600;700&amp;family=Gentium+Plus:wght@400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
  <!-- Bump ASSET_VERSION and the stylesheet query below together on every
       asset change, as map/ does. If they drift, the guard after the link
       repairs a stale stylesheet rather than rendering new markup against
       old rules. -->
  <script>window.ASSET_VERSION = "20260816-5";</script>
  <link rel="stylesheet" href="site.css?v=20260816-5">
  <script>
  (function () {
    var stamped = getComputedStyle(document.documentElement)
      .getPropertyValue("--asset-version").trim().replace(/^["']|["']$/g, "");
    if (stamped === window.ASSET_VERSION) return;
    var bust = "&r=" + Date.now();
    document.querySelectorAll('link[rel="stylesheet"][href*="site.css"]')
      .forEach(function (link) {
        var base = link.getAttribute("href").split("?")[0];
        link.href = base + "?v=" + encodeURIComponent(window.ASSET_VERSION) + bust;
      });
  }());
  </script>
</head>
<body>
  <div id="site-root" role="status" aria-live="polite">Loading the House of Mendes dossier…</div>
  <script>
  (async function () {
    const contentFiles = ["content-1.html","content-2.html","content-3.html","content-4.html","content-5.html"];
    const scriptFiles = ["app-reader.js"];
    const assetVersion = window.ASSET_VERSION;
    async function readParts(files) {
      return Promise.all(files.map(async function (file) {
        const response = await fetch(file + "?v=" + encodeURIComponent(assetVersion));
        if (!response.ok) throw new Error("Could not load " + file + ": " + response.status);
        return response.text();
      }));
    }
    const loaded = await Promise.all([readParts(contentFiles),readParts(scriptFiles)]);
    const root = document.getElementById("site-root");
    root.insertAdjacentHTML("beforebegin",loaded[0].join(""));
    root.remove();
    if (scriptFiles.length) new Function(loaded[1].join(""))();
  }()).catch(function (error) {
    console.error(error);
    const root = document.getElementById("site-root");
    if (root) root.textContent = "The dossier could not be loaded. Please refresh the page.";
  });
  </script>
</body>
</html>
