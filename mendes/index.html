<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Ingredients of the House of Mendes — dossier and interactive map</title>
  <meta name="description" content="A research dossier and ingredient catalogue for Mendesian, Metopion, and Susinum perfumes, with a separate interactive provenance map.">
  <link rel="stylesheet" href="site.css">
  
</head>
<body>
  <div id="site-root" role="status" aria-live="polite">Loading the House of Mendes dossier…</div>
  <script>
  (async function () {
    const contentFiles = ["content-1.html","content-2.html","content-3.html"];
    const scriptFiles = ;
    async function readParts(files) {
      return Promise.all(files.map(async function (file) {
        const response = await fetch(file);
        if (!response.ok) throw new Error("Could not load " + file + ": " + response.status);
        return response.text();
      }));
    }
    const loaded = await Promise.all([readParts(contentFiles),readParts(scriptFiles)]);
    const root = document.getElementById("site-root");
    root.insertAdjacentHTML("beforebegin",loaded[0].join(""));
    root.remove();
    if (scriptFiles.length) new Function(loaded[1].join(""))();
  }()).catch(function (error) {
    console.error(error);
    const root = document.getElementById("site-root");
    if (root) root.textContent = "The dossier could not be loaded. Please refresh the page.";
  });
  </script>
</body>
</html>
