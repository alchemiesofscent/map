<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Interactive ingredient provenance map &#183; House of Mendes</title>
  <meta name="description" content="An interactive source-critical map of ingredient provenance claims for Mendesian, Metopion, and Susinum perfumes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Source+Sans+3:wght@400;600;700&amp;family=Gentium+Plus:ital,wght@0,400;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
  <!-- The asset version appears three times: the site.css link below, assetVersion in the loader, and the back-link in content-1.html. Bump all together. -->
  <link rel="stylesheet" href="site.css?v=20260814-1">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>
  <div id="site-root" role="status" aria-live="polite">Loading the House of Mendes dossier…</div>
  <script>
  (async function () {
    const contentFiles = ["content-1.html"];
    const scriptFiles = ["app-1.js","app-2.js","app-3.js"];
    const assetVersion = "20260814-1";
    async function readParts(files) {
      return Promise.all(files.map(async function (file) {
        const response = await fetch(file + "?v=" + encodeURIComponent(assetVersion));
        if (!response.ok) throw new Error("Could not load " + file + ": " + response.status);
        return response.text();
      }));
    }
    const loaded = await Promise.all([readParts(contentFiles),readParts(scriptFiles)]);
    const root = document.getElementById("site-root");
    root.insertAdjacentHTML("beforebegin",loaded[0].join(""));
    root.remove();
    if (scriptFiles.length) new Function(loaded[1].join(""))();
  }()).catch(function (error) {
    console.error(error);
    const root = document.getElementById("site-root");
    if (root) root.textContent = "The dossier could not be loaded. Please refresh the page.";
  });
  </script>
</body>
</html>
