<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Ingredient journeys &#183; House of Mendes</title>
  <meta name="description" content="Travel the places ancient sources attest for each ingredient of the Mendesian, Metopion, and Susinum perfumes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Source+Sans+3:wght@400;600;700&amp;family=Gentium+Plus:wght@400&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
  <!-- Bump JOURNEY_VERSION and all three stylesheet queries below together on
       every asset change — including changes to ../map/site.css and
       ../shell.css, which this page shares. If they drift, the guard after the
       links repairs the stale stylesheet rather than rendering new markup
       against old rules. -->
  <script>window.JOURNEY_VERSION = "20260815-3";</script>
  <link rel="stylesheet" href="../map/site.css?v=20260815-3">
  <link rel="stylesheet" href="../shell.css?v=20260815-3">
  <link rel="stylesheet" href="journey.css?v=20260815-3">
  <script>
  (function () {
    var stamped = getComputedStyle(document.documentElement)
      .getPropertyValue("--journey-version").trim().replace(/^["']|["']$/g, "");
    if (stamped === window.JOURNEY_VERSION) return;
    var bust = "&r=" + Date.now();
    document.querySelectorAll('link[rel="stylesheet"][href*="site.css"], link[rel="stylesheet"][href*="shell.css"], link[rel="stylesheet"][href*="journey.css"]')
      .forEach(function (link) {
        var base = link.getAttribute("href").split("?")[0];
        link.href = base + "?v=" + encodeURIComponent(window.JOURNEY_VERSION) + bust;
      });
  }());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body class="chart journey" data-explore="false">
  <div id="site-root" role="status" aria-live="polite">
    <span class="visually-hidden">Loading the ingredient journeys…</span>
    <div class="journey-skeleton" aria-hidden="true">
      <svg viewBox="0 0 900 710" preserveAspectRatio="xMidYMid slice" focusable="false">
        <path class="skeleton-coast" d="M112 236 L196 214 L268 244 L332 220 L404 250 L468 232 L512 268 L470 316 L446 372 L470 430 L512 486 L556 548 L596 618 M512 268 L570 258 L628 286 L672 262 L724 292 M446 372 L520 396 L578 448 L618 516 M628 286 L688 330 L742 386 L788 458"></path>
      </svg>
    </div>
  </div>
  <script>
  (async function () {
    const contentFiles = ["content-1.html"];
    // The first script is the map's data file: the claims have one home, and it
    // opens the shared async IIFE that app-3.js closes.
    const scriptFiles = ["../map/app-1.js","app-2.js","app-3.js"];
    const assetVersion = window.JOURNEY_VERSION;
    async function readParts(files) {
      return Promise.all(files.map(async function (file) {
        const response = await fetch(file + "?v=" + encodeURIComponent(assetVersion));
        if (!response.ok) throw new Error("Could not load " + file + ": " + response.status);
        return response.text();
      }));
    }
    const loaded = await Promise.all([readParts(contentFiles),readParts(scriptFiles)]);
    const root = document.getElementById("site-root");
    root.insertAdjacentHTML("beforebegin",loaded[0].join(""));
    root.remove();
    if (scriptFiles.length) new Function(loaded[1].join(""))();
  }()).catch(function (error) {
    console.error(error);
    const root = document.getElementById("site-root");
    if (root) root.textContent = "The journeys could not be loaded. Please refresh the page.";
  });
  </script>
</body>
</html>
